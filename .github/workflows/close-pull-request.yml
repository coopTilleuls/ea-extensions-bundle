name: Close pull request

# This repository is a read-only split of coopTilleuls/cgt-test, generated by
# its CI: changes made here would be overwritten by the next split.

on:
    pull_request_target:
        types: [opened]

permissions:
    pull-requests: write

jobs:
    close:
        runs-on: ubuntu-24.04
        steps:
            -   name: Close the pull request
                env:
                    GH_TOKEN: ${{ github.token }}
                    PR_URL: ${{ github.event.pull_request.html_url }}
                run: |
                    gh pr close "$PR_URL" --comment "Thanks for your pull request! This repository is read-only: it is generated from the [coopTilleuls/cgt-test](https://github.com/coopTilleuls/cgt-test) repository. Please open your pull request there instead."
