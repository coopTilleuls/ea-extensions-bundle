name: CI

on:
    push:
        branches:
            - main
    pull_request: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    php-cs-fixer:
        name: PHP-CS-Fixer
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none

            -   name: Install Composer dependencies
                uses: ramsey/composer-install@v4

            -   name: Run PHP-CS-Fixer
                run: vendor/bin/php-cs-fixer fix --dry-run --diff

    phpstan:
        name: PHPStan
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none

            -   name: Install Composer dependencies
                uses: ramsey/composer-install@v4

            -   name: Run PHPStan
                run: vendor/bin/phpstan analyse --memory-limit=1G

    rector:
        name: Rector
        runs-on: ubuntu-24.04
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.4'
                    coverage: none

            -   name: Install Composer dependencies
                uses: ramsey/composer-install@v4

            -   name: Run Rector
                run: vendor/bin/rector process --dry-run

    tests:
        name: Tests (PHP ${{ matrix.php-version }}, ${{ matrix.dependency-versions }} deps)
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.4']
                dependency-versions: [highest]
                include:
                    -   php-version: '8.4'
                        dependency-versions: lowest
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    extensions: pdo_sqlite
                    coverage: none

            -   name: Install Composer dependencies
                uses: ramsey/composer-install@v4
                with:
                    dependency-versions: ${{ matrix.dependency-versions }}

            -   name: Run PHPUnit
                run: vendor/bin/phpunit
